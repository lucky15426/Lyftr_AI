# Render Blueprint for the backend. Create via: Dashboard -> New -> Blueprint.
# NOTE: persistent disks require a paid instance type (starter or above).
services:
  - type: web
    name: lyftr-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS
        sync: false            # set in the dashboard (secret)
      - key: LLM_MODEL
        value: gemini/gemini-3.1-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false            # e.g. https://your-app.vercel.app
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
